databases:
  - name: shipshape-releases-db
    databaseName: releases
    user: shipshape
    plan: basic-256mb

services:
  - type: web
    name: shipshape-releases
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shipshape-releases-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
