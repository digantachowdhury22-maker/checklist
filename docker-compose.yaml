services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: releases
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d releases"]
      interval: 3s
      timeout: 3s
      retries: 15

  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@db:5432/releases
      CORS_ORIGIN: "*"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
